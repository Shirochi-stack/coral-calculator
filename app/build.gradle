plugins {
    id 'com.android.application'
}

// Google Play upload key. keystore.properties is kept out of source control; without it the
// release bundle is built unsigned, as it is in CI.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.coral.calculator'
    compileSdk 36

    defaultConfig {
        applicationId 'com.halgakos.calculator'
        minSdk 26
        targetSdk 36
        versionCode 140
        versionName '3.58.0'
    }

    // The outfits, and Plus run's other art kept out of the base module, are install-time asset packs; the debug APK carries them in the app itself.
    assetPacks = [':vanity', ':runart', ':mirror', ':voices', ':films']
    sourceSets {
        debug {
            assets.srcDirs += ['../vanity/src/main/assets', '../runart/src/main/assets', '../mirror/src/main/assets', '../voices/src/main/assets', '../films/src/main/assets']
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            upload {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
