plugins {
    id 'com.android.application'
}

// Google Play upload key. keystore.properties is kept out of source control; without it the
// release bundle is built unsigned, as it is in CI.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.coral.calculator'
    compileSdk 36

    defaultConfig {
        applicationId 'com.halgakos.calculator'
        minSdk 26
        targetSdk 36
        versionCode 29
        versionName '1.5.1'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            upload {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
